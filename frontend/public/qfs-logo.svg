<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">QFS Logo</title>
  <desc id="desc">Blue circuit board logo with QFS initials</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1f66"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="92" height="92" rx="16" fill="url(#bg)"/>

  <g stroke="url(#glow)" stroke-width="2" opacity="0.5" fill="none">
    <path d="M8 24h24l8-8h20"/>
    <path d="M88 72H64l-8 8H36"/>
    <path d="M16 84V62l10-10h14"/>
    <path d="M80 12v22l-10 10H56"/>
  </g>

  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="48" y="48" font-size="28">QFS</text>
    <text x="48" y="66" font-size="8" opacity="0.9">QUANTUM FINANCIAL</text>
  </g>

  <rect x="2" y="2" width="92" height="92" rx="16" fill="none" stroke="#93c5fd" stroke-opacity="0.35"/>
</svg>
